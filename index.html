<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Runner de toque</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f14;
      color: #f5f5f7;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .tela-inicial {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      text-align: center;
      padding: 2rem;
    }

    .tela-inicial h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .botao-jogar {
      padding: 1rem 3.5rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f0f14;
      background: #f5f5f7;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .botao-jogar:hover {
      background: #ffffff;
      transform: scale(1.05);
    }

    .botao-jogar:focus-visible {
      outline: 3px solid #7aa2ff;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main class="tela-inicial">
    <h1>Runner de toque</h1>
    <button type="button" class="botao-jogar" id="botao-jogar">Jogar</button>
  </main>
</body>
</html>
